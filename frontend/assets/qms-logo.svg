<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="qmsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Outer corridor arc: forms the main body of the Q -->
  <path d="M100 24
           A76 76 0 1 0 176 100"
        fill="none"
        stroke="url(#qmsGradient)"
        stroke-width="20"
        stroke-linecap="round"/>

  <!-- Inner corridor arc: parallel channel, same sweep, smaller radius -->
  <path d="M100 60
           A40 40 0 1 0 140 100"
        fill="none"
        stroke="url(#qmsGradient)"
        stroke-width="14"
        stroke-linecap="round"
        opacity="0.55"/>

  <!-- Tail of the Q: doubles as the corridor exit / quote-mark flick -->
  <path d="M132 132 L168 168"
        fill="none"
        stroke="url(#qmsGradient)"
        stroke-width="20"
        stroke-linecap="round"/>
</svg>
